<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facs ID Setup</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #0b111e 0%, #1c45ba 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* --- FULL-PAGE EXPANDING DOTTED ORBITAL RINGS --- */
        .page-solar-orbit {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px dashed rgba(0, 255, 136, 0);
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: all 0.6s ease;
        }

        .scanning .page-orbit-1 {
            width: 350px; height: 350px;
            border-color: rgba(0, 255, 136, 0.4);
            animation: solarSpin1 8s linear infinite;
            opacity: 1;
        }
        .scanning .page-orbit-2 {
            width: 550px; height: 550px;
            border-color: rgba(0, 255, 136, 0.25);
            animation: solarSpin2 14s linear infinite reverse;
            opacity: 1;
        }
        .scanning .page-orbit-3 {
            width: 750px; height: 750px;
            border-color: rgba(0, 255, 136, 0.15);
            animation: solarSpin3 20s linear infinite;
            opacity: 1;
        }

        /* Locked state styling */
        .locked .page-solar-orbit { opacity: 1 !important; }
        .locked .page-orbit-1 { border-color: rgba(255, 59, 48, 0.6) !important; }
        .locked .page-orbit-2 { border-color: rgba(255, 59, 48, 0.4) !important; }
        .locked .page-orbit-3 { border-color: rgba(255, 59, 48, 0.2) !important; }

        @keyframes solarSpin1 { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes solarSpin2 { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes solarSpin3 { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        /* iPhone Card Wrapper */
        .iphone-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 92%;
            max-width: 420px;
            padding: 30px 20px 20px 20px;
            border-radius: 32px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            text-align: center;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            position: relative;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .iphone-card.locked-card {
            border-color: rgba(255, 59, 48, 0.5);
            box-shadow: 0 25px 60px rgba(255, 59, 48, 0.2);
        }

        .faceid-circle-container {
            position: relative;
            width: 220px;
            height: 220px;
            max-width: 60vw;
            max-height: 60vw;
            margin: 15px auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (max-width: 480px) {
            .faceid-circle-container {
                width: 180px;
                height: 180px;
            }
            .iphone-card {
                padding: 24px 16px 16px 16px;
            }
        }

        .dashed-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            animation: rotateRing 25s linear infinite;
            transition: border-color 0.3s ease;
        }

        @keyframes rotateRing {
            100% { transform: rotate(360deg); }
        }

        .mesh-viewport {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            overflow: hidden;
            background: #000;
            position: relative;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        video { display: none; }

        #scene-canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 260px;
            height: 260px;
            transform: translate(-50%, -50%) scaleX(-1);
        }

        h2 {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin: 0 0 6px 0;
            transition: color 0.3s ease;
        }

        p {
            font-size: 0.82rem;
            color: #94a3b8;
            margin: 0 0 15px 0;
            line-height: 1.4;
            padding: 0 10px;
            min-height: 36px;
        }

        .btn {
            background: #00ff88;
            color: #0b111e;
            border: none;
            width: 100%;
            max-width: 320px;
            padding: 14px;
            font-size: 1rem;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }
        .btn:hover { background: #00cc6a; }
        .btn:disabled { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.3); cursor: not-allowed; box-shadow: none; }

        #status {
            margin-top: 10px;
            font-size: 0.78rem;
            color: #00ff88;
            font-family: ui-monospace, monospace;
            white-space: pre-wrap;
            min-height: 18px;
        }

        .powered-footer {
            margin-top: 18px;
            font-size: 0.7rem;
            color: #64748b;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 500;
        }

        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-card {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 28px;
            border-radius: 24px;
            width: 85%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .modal-card input {
            width: 100%;
            padding: 12px 16px;
            margin: 15px 0;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 10px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            text-align: center;
        }
        .modal-card input:focus { border-color: #00ff88; }
    </style>
</head>
<body id="pageBody">

    <div class="page-solar-orbit page-orbit-1"></div>
    <div class="page-solar-orbit page-orbit-2"></div>
    <div class="page-solar-orbit page-orbit-3"></div>

    <div class="iphone-card" id="iphoneCard">
        <h2 id="cardTitle">Facs ID Setup</h2>
        <p id="instruction">Position your face inside the frame.</p>
        
        <div class="faceid-circle-container">
            <div class="dashed-ring" id="dashedRing"></div>
            <div class="mesh-viewport" id="meshViewport">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="scene-canvas"></canvas>
            </div>
        </div>
        
        <button id="startBtn" class="btn" onclick="startSetupScan()" disabled>Get Started</button>
        <div id="status"></div>
        <div class="powered-footer">powered by pulse</div>
    </div>

    <div id="modal-overlay">
        <div class="modal-card">
            <h3 style="color: #fff; margin-top:0; font-size: 1.2rem;">Complete Setup</h3>
            <p style="font-size:0.85rem; color:#94a3b8; margin-bottom: 10px;">Enter your account name to save your spatial profile:</p>
            <input type="text" id="usernameInput" placeholder="Account Name" />
            <button class="btn" style="margin-top:0;" onclick="submitRegistration()">Save Profile</button>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('scene-canvas');
        const instruction = document.getElementById('instruction');
        const statusDiv = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const dashedRing = document.getElementById('dashedRing');
        const meshViewport = document.getElementById('meshViewport');
        const pageBody = document.getElementById('pageBody');
        const iphoneCard = document.getElementById('iphoneCard');
        const cardTitle = document.getElementById('cardTitle');
        const modalOverlay = document.getElementById('modal-overlay');
        const usernameInput = document.getElementById('usernameInput');

        let rawLandmarks = null;
        let isScanning = false;
        let scanComplete = false;
        let sampledFrames = [];
        let cachedFaceVector = null;
        let blinkCount = 0;
        let eyeWasClosed = false;

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000); 
        camera.position.z = 1.8; 
        
        const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
        renderer.setSize(260, 260); 
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
        
        const particleCount = 30000;
        const positions = new Float32Array(particleCount * 3);
        const offsets = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i++) offsets[i] = (Math.random() - 0.5) * 0.1; 
        
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        const material = new THREE.PointsMaterial({ color: 0x00ff88, size: 0.012, transparent: true, opacity: 0.85, depthWrite: false });
        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        function animate() { 
            requestAnimationFrame(animate); 
            renderer.render(scene, camera); 
        } 
        animate();

        function calculateEAR(p1, p2, p3, p4, p5, p6) {
            const v1 = Math.hypot(p2.x - p6.x, p2.y - p6.y);
            const v2 = Math.hypot(p3.x - p5.x, p3.y - p5.y);
            const h = Math.hypot(p1.x - p4.x, p1.y - p4.y);
            return (v1 + v2) / (2.0 * (h || 1));
        }

        function extractNormalizedVector(landmarks) {
            const nose = landmarks[1];
            let vec = [];
            for (let i = 0; i < 468; i++) {
                vec.push(landmarks[i].x - nose.x, landmarks[i].y - nose.y, landmarks[i].z - nose.z);
            }
            let sumSq = vec.reduce((a, b) => a + b*b, 0);
            const norm = Math.sqrt(sumSq) || 1;
            return vec.map(v => v / norm);
        }

        // --- FULL RESET FUNCTION TO CLEAR PREVIOUS LOCKS & ERRORS CLEANLY ---
        function resetUIState() {
            pageBody.classList.remove('scanning', 'locked');
            iphoneCard.classList.remove('locked-card');
            cardTitle.innerText = "Facs ID Setup";
            cardTitle.style.color = "#fff";
            statusDiv.innerText = "";
            statusDiv.style.color = "#00ff88";
            material.color.setHex(0x00ff88);
            dashedRing.style.borderColor = "rgba(0, 255, 136, 0.4)";
            meshViewport.style.borderColor = "rgba(0, 255, 136, 0.4)";
        }

        const faceMesh = new FaceMesh({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

        faceMesh.onResults((res) => {
            if (scanComplete || pageBody.classList.contains('locked')) return; // Ignore if locked or finished

            if (res.multiFaceLandmarks && res.multiFaceLandmarks.length > 0) {
                rawLandmarks = res.multiFaceLandmarks[0].slice(0, 468);
                
                const leftEAR = calculateEAR(rawLandmarks[362], rawLandmarks[385], rawLandmarks[387], rawLandmarks[263], rawLandmarks[373], rawLandmarks[380]);
                const rightEAR = calculateEAR(rawLandmarks[33], rawLandmarks[160], rawLandmarks[158], rawLandmarks[133], rawLandmarks[153], rawLandmarks[144]);
                const avgEAR = (leftEAR + rightEAR) / 2;

                if (isScanning) {
                    if (avgEAR < 0.18) {
                        eyeWasClosed = true;
                    } else if (avgEAR >= 0.22 && eyeWasClosed) {
                        blinkCount++;
                        eyeWasClosed = false;
                    }
                    sampledFrames.push(extractNormalizedVector(rawLandmarks));
                }

                const nose = rawLandmarks[1];
                const leftCheek = rawLandmarks[234];
                const rightCheek = rawLandmarks[454];
                const faceWidth = Math.hypot(rightCheek.x - leftCheek.x, rightCheek.y - leftCheek.y);

                const isCentered = Math.abs(nose.x - 0.5) < 0.15 && Math.abs(nose.y - 0.5) < 0.15;
                const isTooClose = faceWidth > 0.55; 

                if (isTooClose) {
                    instruction.innerText = "Error: Face too close to camera. Move back.";
                    startBtn.disabled = true;
                    dashedRing.style.borderColor = "#ff3b30";
                    meshViewport.style.borderColor = "#ff3b30";
                } else if (!isCentered && !isScanning) {
                    instruction.innerText = "Error: Face not centered or out of frame.";
                    startBtn.disabled = true;
                    dashedRing.style.borderColor = "rgba(255, 255, 255, 0.25)";
                    meshViewport.style.borderColor = "rgba(255, 255, 255, 0.2)";
                } else {
                    const targetX = (nose.x - 0.5) * -2.0;
                    const targetY = -(nose.y - 0.5) * -2.0;
                    camera.position.x += (targetX - camera.position.x) * 0.1;
                    camera.position.y += (targetY - camera.position.y) * 0.1;

                    const targetZ = Math.max(1.2, Math.min(2.2, 0.8 / (faceWidth * 1.8)));
                    camera.position.z += (targetZ - camera.position.z) * 0.1;

                    if (isScanning) {
                        dashedRing.style.borderColor = "rgba(0, 255, 136, 0.8)";
                        meshViewport.style.borderColor = "rgba(0, 255, 136, 0.8)";
                    } else if (!scanComplete) {
                        dashedRing.style.borderColor = "rgba(0, 255, 136, 0.4)";
                        meshViewport.style.borderColor = "rgba(0, 255, 136, 0.4)";
                    }

                    if (!isScanning && !scanComplete && !modalOverlay.style.display) {
                        instruction.innerText = "Face recognized. Tap Get Started.";
                        startBtn.disabled = false;
                    }
                }

                const pos = particleSystem.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    const t = rawLandmarks[i % 468]; 
                    pos[i*3]     = ((t.x - 0.5)*4) + offsets[i*3];
                    pos[i*3+1]   = (-(t.y - 0.5)*4) + offsets[i*3+1];
                    pos[i*3+2]   = (-t.z*4) + offsets[i*3+2];
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;

            } else {
                if (!isScanning && !scanComplete && !modalOverlay.style.display) {
                    instruction.innerText = "Error: Face not found.";
                    startBtn.disabled = true;
                    dashedRing.style.borderColor = "rgba(255, 255, 255, 0.25)";
                    meshViewport.style.borderColor = "rgba(255, 255, 255, 0.2)";
                }
            }
        });

        const cameraFeed = new Camera(videoElement, {
            onFrame: async () => await faceMesh.send({image: videoElement}),
            width: 640, height: 480
        });
        cameraFeed.start();

        async function startSetupScan() {
            if (!rawLandmarks || isScanning) return;
            
            // CLEAN RESET BEFORE STARTING NEW SCAN
            resetUIState();

            isScanning = true;
            scanComplete = false;
            startBtn.disabled = true;
            sampledFrames = [];
            blinkCount = 0; 
            eyeWasClosed = false;

            pageBody.classList.add('scanning');

            const duration = 5000;
            const interval = 100;
            let elapsed = 0;

            const timer = setInterval(() => {
                if (!rawLandmarks) {
                    clearInterval(timer);
                    isScanning = false;
                    pageBody.classList.remove('scanning');
                    instruction.innerText = "Error: Face not found.";
                    startBtn.disabled = false;
                    return;
                }

                const leftCheek = rawLandmarks[234];
                const rightCheek = rawLandmarks[454];
                const faceWidth = Math.hypot(rightCheek.x - leftCheek.x, rightCheek.y - leftCheek.y);
                const nose = rawLandmarks[1];
                const isStillCentered = Math.abs(nose.x - 0.5) < 0.2 && Math.abs(nose.y - 0.5) < 0.2;
                const isStillTooClose = faceWidth > 0.55;

                if (!isStillCentered || isStillTooClose) {
                    clearInterval(timer);
                    isScanning = false;
                    pageBody.classList.remove('scanning');
                    instruction.innerText = "Error: Position invalid. Scan aborted.";
                    startBtn.disabled = false;
                    return;
                }

                if (blinkCount > 3) {
                    clearInterval(timer);
                    isScanning = false;
                    scanComplete = true;
                    
                    pageBody.classList.remove('scanning');
                    pageBody.classList.add('locked');
                    iphoneCard.classList.add('locked-card');
                    
                    cardTitle.innerText = "Locked by Pulse";
                    cardTitle.style.color = "#ff3b30";
                    instruction.innerText = "Security protocol engaged due to excessive blinking.";
                    statusDiv.innerText = "Access Blocked";
                    statusDiv.style.color = "#ff3b30";
                    
                    material.color.setHex(0xff3b30);
                    dashedRing.style.borderColor = "#ff3b30";
                    meshViewport.style.borderColor = "#ff3b30";
                    startBtn.disabled = false;
                    return; 
                }

                elapsed += interval;
                const secondsLeft = Math.ceil((duration - elapsed) / 1000);
                instruction.innerText = `encoding Face to Pulse... (${secondsLeft}s)`;

                if (elapsed >= duration) {
                    clearInterval(timer);
                    pageBody.classList.remove('scanning');
                    finalizeSetupScan();
                }
            }, interval);
        }

        async function finalizeSetupScan() {
            isScanning = false;
            scanComplete = true;

            if (sampledFrames.length === 0) {
                instruction.innerText = "Scan Failed: Lost tracking.";
                startBtn.disabled = false;
                scanComplete = false;
                return;
            }

            instruction.innerText = "Processing profile...";

            const finalVector = new Array(1404).fill(0);
            for (let f = 0; f < sampledFrames.length; f++) {
                for (let d = 0; d < 1404; d++) finalVector[d] += sampledFrames[f][d];
            }
            for (let d = 0; d < 1404; d++) finalVector[d] /= sampledFrames.length;

            let sumSq = 0;
            for (let d = 0; d < 1404; d++) sumSq += finalVector[d] * finalVector[d];
            const norm = Math.sqrt(sumSq) || 1;
            cachedFaceVector = finalVector.map(v => v / norm);

            try {
                const response = await fetch('/api/v1/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ faceVector: cachedFaceVector })
                });

                const data = await response.json();
                if (data.success) {
                    if (data.isNewUser) {
                        modalOverlay.style.display = 'flex';
                    } else {
                        instruction.innerText = `Welcome back, ${data.userId}`;
                        statusDiv.innerText = `Access Granted`;
                        localStorage.setItem('facs_token', data.token);
                        setTimeout(() => window.location.href = '/home', 1500);
                    }
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                modalOverlay.style.display = 'flex';
            }
        }

        async function submitRegistration() {
            const userId = usernameInput.value.trim();
            if (!userId) return alert('Enter a valid account name.');

            try {
                const response = await fetch('/api/v1/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, faceVector: cachedFaceVector })
                });

                const data = await response.json();
                if (data.success) {
                    modalOverlay.style.display = 'none';
                    instruction.innerText = `Setup Complete: Welcome, ${userId}`;
                    statusDiv.innerText = `Profile Saved`;
                    localStorage.setItem('facs_token', data.token);

                    setTimeout(() => window.location.href = '/home', 1500);
                } else {
                    throw new Error(data.error);
                }
            } catch (err) {
                alert(`Registration failed: ${err.message}`);
            }
        }
    </script>
</body>
</html>
