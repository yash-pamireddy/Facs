<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facs - Home</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #0b111e 0%, #1c45ba 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            box-sizing: border-box;
            padding: 30px 50px;
        }

        /* Top Header Navigation */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            opacity: 0.9;
        }

        .header-nav {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 22px;
            font-size: 0.88rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            backdrop-filter: blur(12px);
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .header-btn:hover {
            background: rgba(0, 255, 136, 0.12);
            border-color: rgba(0, 255, 136, 0.35);
            color: #00ff88;
        }

        .btn-logout {
            background: rgba(255, 59, 48, 0.08);
            color: #ff3b30;
            border: 1px solid rgba(255, 59, 48, 0.25);
        }

        .btn-logout:hover {
            background: rgba(255, 59, 48, 0.18);
            border-color: rgba(255, 59, 48, 0.5);
            color: #ff3b30;
        }

        /* Main Centered Hero Content */
        .hero-container {
            text-align: center;
            max-width: 900px;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: 3.2rem;
            font-weight: 600;
            letter-spacing: -1px;
            margin: 0;
        }

        .accent {
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.35);
        }

        p {
            font-size: 1rem;
            color: #94a3b8;
            margin: 0;
            letter-spacing: 0.5px;
            font-weight: 400;
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 0.72rem;
            color: #cbd5e1;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            width: 100%;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>

    <!-- Top Header Bar -->
    <div class="header">
        <div class="logo">FACS CORE</div>
        <div class="header-nav">
            <button class="header-btn" onclick="window.location.href='/dashboard'">Dashboard</button>
            <button class="header-btn" onclick="window.location.href='/upgrade'">Upgrade</button>
            <button class="header-btn btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- Hero Content -->
    <div class="hero-container">
        <h1>Welcome, <span class="accent" id="displayName">USER</span></h1>
        <p>Spatial Biometric Engine &mdash; Secure Core Network Active</p>
    </div>

    <!-- Footer -->
    <div class="footer">powered by pulse</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('facs_token');
            if (!token) {
                window.location.href = '/auth';
                return;
            }

            try {
                const decodedToken = atob(token);
                const parts = decodedToken.split('_');
                const username = parts[parts.length - 1];
                document.getElementById('displayName').innerText = username.toUpperCase();
            } catch (err) {
                console.error("Token read error:", err);
                document.getElementById('displayName').innerText = "VERIFIED";
            }
        });

        function logout() {
            localStorage.removeItem('facs_token');
            window.location.href = '/auth';
        }
    </script>
</body>
</html>
