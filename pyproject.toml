[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "facs-pulse"
version = "0.1.0"
description = "Biometric Face ID authentication engine, powered by the Pulse ecosystem"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "opencv-python>=4.0.0",
    "face-recognition>=1.3.0",
    "numpy>=1.20.0",
    "setuptools<=81",
    "face_recognition_models @ git+https://github.com/ageitgey/face_recognition_models"
]

[project.scripts]
facs = "facs.auth:authenticate_or_register"